name: CI

on:
  push:
    branches:
    - main
  pull_request:
    branches:
    - main
  release:
    types: [published]
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-ci
  cancel-in-progress: true

jobs:
  macos:
    runs-on: macOS-latest
    timeout-minutes: 15
    steps: 
    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
    - name: SPM tests
      run: swift test --enable-code-coverage --parallel
    - name: Upload coverage data
      uses: vapor/swift-codecov-action@c93caea6600dbe3af0266a8ef6ee195c00181f04  # v0.3.7
      with:
        codecov_token: ${{ secrets.CODECOV_TOKEN }}  linux:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        image: ["swift:6.2", "swift:6.3", "swift:6.4"]
    container:
      image: ${{ matrix.image }}
    steps:
    - name: Install curl
      run: apt-get update -yq && apt-get install -y curl
    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
    - name: Test
      run: |
        swift test --enable-code-coverage --parallel
    - name: Upload coverage data
      uses: vapor/swift-codecov-action@c93caea6600dbe3af0266a8ef6ee195c00181f04  # v0.3.7
      with:
        codecov_token: ${{ secrets.CODECOV_TOKEN }}